model:
  backbone: dinov3
  dinov3_name: dinov3_vitb16
  dinov3_pretrained: /scr/user/qinglong/dataset/DINOv3/pre_trained/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  dinov3_output_layers: [3, 7, 11]
  attention_backend: auto
  sva_layers: [3, 6, 9]
  sva_dropout: 0.0
  use_checkpoint: true         # 启用 gradient checkpointing

  cvt:
    feat_key: stage2
    feature_dim: 256
    num_layers: 6
    nhead: 8
    fpe_enable: true
    aas_enable: true
    d_bins: 64
    scales: [4, 8, 16]
    num_groups: 8
    attention_backend: auto
    use_checkpoint: true       # 启用 gradient checkpointing
    share_across_scales: false

  point:
    num_points: 12000
    use_all_if_fewer: true
    use_gt_mask_for_sampling: true
    feat_dim: 160
    lift_stage_keys: [stage1, stage2, stage3]
    knn: 16
    candidate_k: 64
    edgeconv_layers: [128, 192, 256]
    delta_scale: 0.01
    use_checkpoint: true       # 启用 checkpoint
    predict_uncertainty: true

  densify:
    enable: true
    tau_sigma: 0.15
    tau_alpha: 0.6
    use_sigma_gate: true
    split_factor: 2
    offset_scale: 0.35
    max_new_points: 12000
    final_knn: 16
    final_candidate_k: 64

data:
  dataset: dtu
  train_root: /scr/user/qinglong/dataset/DTU/dtu_training
  val_root: /scr/user/qinglong/dataset/DTU/dtu_training
  test_root: /scr/user/qinglong/dataset/DTU/dtu_test
  test_gt_root: /scr/user/qinglong/dataset/DTU/dtu_training
  train_layout: trainval
  val_layout: trainval
  test_layout: dtu_test
  train_list: lists/dtu/train.txt
  val_list: lists/dtu/val.txt
  test_list: lists/dtu/test.txt
  pair_file: Cameras/pair.txt
  camera_dir: Cameras
  rectified_dir: Rectified_raw
  depth_dir: Depths_raw
  mask_dir: Depths_raw
  test_image_dir: images
  test_camera_dirs: [cams_1, cams]
  test_pair_file: pair.txt
  img_h: 1024
  img_w: 1280
  n_views: 5
  train_light_ids: [0, 1, 2, 3, 4, 5, 6]
  eval_light_ids: [3]
  depth_scale: 1.0

train:
  stage: coarse_only          # 第一阶段：只训练 coarse depth
  epochs: 20                   # 修改为 20 个 epoch
  batch_size_per_gpu: 16       # 从 4 提高到 16
  batch_size_point_per_gpu: 16 # 从 4 提高到 16
  batch_size_joint_per_gpu: 16 # 从 4 提高到 16
  num_workers: 8               # 保持 8，平衡 CPU 内存和加载速度
  grad_accum_steps: 2          # 新增：梯度累积，等效 batch size=32
  grad_clip: 1.0
  amp_dtype: bf16
  use_ddp: false
  seed: 42
  log_interval: 20
  val_interval: 1
  save_interval: 1
  monitor_key: depth_abs_error  # 第一阶段监控 depth 误差
  use_loss_nan_check: true
  early_stop_on_nan: true
  tensorboard:
    enable: true
    log_dir: tensorboard
    scalar_interval: 20
    image_interval: 200
    feature_stage: stage2

optim:
  name: adamw
  lr_backbone: 0.00005         # 降低学习率适应更大 batch size
  lr_coarse: 0.0001            # 降低学习率适应更大 batch size
  lr_point: 0.0002             # point 模块不训练
  joint_coarse_lr_scale: 0.2
  weight_decay: 0.01
  betas: [0.9, 0.999]
  warmup_epochs: 2             # 增加 warmup 轮数
  warmup_lr_init: 1.0e-6

loss:
  coarse_weight: 1.0           # 第一阶段只用 coarse loss
  chamfer_weight: 0.0          # 关闭 chamfer loss
  uncertainty_weight: 0.0      # 关闭 uncertainty loss
  feature_weight: 0.0          # 关闭 feature loss
  repulsion_weight: 0.0
  alpha_weight: 0.0
  alpha_error_threshold: 2.0
  feature_stage: stage2
  depth_loss_scale: 0.01
  chamfer_loss_scale: 0.001

ddp:
  backend: nccl
  find_unused_parameters: false
  broadcast_buffers: false

# UPR-MVS Stage A: Coarse Depth Pretraining Configuration
# 用于本地 RTX 5060Ti 16GB 单卡测试

model:
  backbone: dinov3
  dinov3_name: dinov3_vitb16
  dinov3_pretrained: /home/william/project/dataset/DINOv3/pre_trained/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  dinov3_output_layers: [3, 7, 11]
  attention_backend: auto
  sva_layers: [3, 6, 9]
  sva_dropout: 0.0
  use_checkpoint: true

  cvt:
    feat_key: stage2
    feature_dim: 256
    num_layers: 6
    nhead: 8
    fpe_enable: true
    aas_enable: true
    d_bins: 64
    scales: [4, 8, 16]
    num_groups: 8
    attention_backend: auto
    use_checkpoint: true
    share_across_scales: false

  point:
    num_points: 12000
    use_all_if_fewer: true
    use_gt_mask_for_sampling: true
    feat_dim: 160
    lift_stage_keys: [stage1, stage2, stage3]
    knn: 16
    candidate_k: 64
    edgeconv_layers: [128, 192, 256]
    delta_scale: 0.01
    use_checkpoint: true
    predict_uncertainty: true

  densify:
    enable: false

data:
  dataset: dtu
  train_root: /home/william/project/dataset/DTU/dtu_training
  val_root: /home/william/project/dataset/DTU/dtu_training
  test_root: /home/william/project/dataset/DTU/dtu_training
  test_gt_root: /home/william/project/dataset/DTU/dtu_training
  train_layout: trainval
  val_layout: trainval
  test_layout: trainval
  train_list: lists/dtu/train.txt
  val_list: lists/dtu/val.txt
  test_list: lists/dtu/test.txt
  pair_file: Cameras/pair.txt
  camera_dir: Cameras
  rectified_dir: Rectified_raw
  depth_dir: Depths_raw
  mask_dir: Depths_raw
  test_image_dir: Rectified_raw
  test_camera_dirs: [Cameras]
  test_pair_file: Cameras/pair.txt
  img_h: 512
  img_w: 640
  n_views: 5
  train_light_ids: [0]
  eval_light_ids: [0]
  depth_scale: 1.0

train:
  stage: coarse_only
  epochs: 1
  batch_size_per_gpu: 1
  batch_size_joint_per_gpu: 1
  num_workers: 0
  grad_accum_steps: 1
  grad_clip: 1.0
  amp_dtype: bf16
  seed: 42
  log_interval: 1
  val_interval: 1
  save_interval: 1
  monitor_key: depth_abs_error
  use_loss_nan_check: true
  early_stop_on_nan: true
  tensorboard:
    enable: true
    log_dir: tensorboard
    scalar_interval: 1
    image_interval: 1
    feature_stage: stage2

optim:
  name: adamw
  lr_backbone: 0.0001
  lr_coarse: 0.0002
  lr_point: 0.0002
  joint_coarse_lr_scale: 0.2
  weight_decay: 0.01
  betas: [0.9, 0.999]
  warmup_epochs: 1
  warmup_lr_init: 1.0e-6

scheduler:
  name: cosine
  min_lr: 1.0e-6

loss:
  coarse_weight: 1.0
  chamfer_weight: 0.0
  uncertainty_weight: 0.0
  feature_weight: 0.0
  repulsion_weight: 0.0
  alpha_weight: 0.0
  alpha_error_threshold: 2.0
  feature_stage: stage2
  depth_loss_scale: 0.01
  chamfer_loss_scale: 0.001

ddp:
  backend: nccl
  find_unused_parameters: false
  broadcast_buffers: false

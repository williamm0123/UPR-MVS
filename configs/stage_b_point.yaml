# UPR-MVS Stage B: Point Refiner Training Configuration
# 用于服务器 A100 80GB 单卡训练

model:
  backbone: dinov3
  dinov3_name: dinov3_vitb16
  dinov3_pretrained: /scr/user/qinglong/dataset/DINOv3/pre_trained/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  dinov3_output_layers: [3, 7, 11]
  attention_backend: sdpa
  sva_layers: [3, 6, 9]
  sva_dropout: 0.0
  use_checkpoint: true          # 启用 gradient checkpointing

  cvt:
    feat_key: stage2
    feature_dim: 256
    num_layers: 6
    nhead: 8
    fpe_enable: true
    aas_enable: true
    d_bins: 64
    scales: [4, 8, 16]
    num_groups: 8
    attention_backend: sdpa
    use_checkpoint: true        # 启用 gradient checkpointing
    share_across_scales: false

  point:
    num_points: 12000
    use_all_if_fewer: true
    use_gt_mask_for_sampling: true
    feat_dim: 160
    lift_stage_keys: [stage1, stage2, stage3]
    knn: 16
    candidate_k: 64
    edgeconv_layers: [128, 192, 256]
    delta_scale: 0.01
    use_checkpoint: false       # point 模块训练，但 checkpoint 已在 backbone/cvt 启用
    predict_uncertainty: true

  densify:
    enable: true
    tau_sigma: 0.15
    tau_alpha: 0.6
    use_sigma_gate: true
    split_factor: 2
    offset_scale: 0.35
    max_new_points: 12000
    final_knn: 16
    final_candidate_k: 64

data:
  dataset: dtu
  train_root: /scr/user/qinglong/dataset/DTU/dtu_training
  val_root: /scr/user/qinglong/dataset/DTU/dtu_training
  test_root: /scr/user/qinglong/dataset/DTU/dtu_test
  test_gt_root: /scr/user/qinglong/dataset/DTU/dtu_training
  train_layout: trainval
  val_layout: trainval
  test_layout: dtu_test
  train_list: lists/dtu/train.txt
  val_list: lists/dtu/val.txt
  test_list: lists/dtu/test.txt
  pair_file: Cameras/pair.txt
  camera_dir: Cameras
  rectified_dir: Rectified_raw
  depth_dir: Depths_raw
  mask_dir: Depths_raw
  test_image_dir: images
  test_camera_dirs: [cams_1, cams]
  test_pair_file: pair.txt
  img_h: 1024
  img_w: 1280
  n_views: 5
  train_light_ids: [0, 1, 2, 3, 4, 5, 6]
  eval_light_ids: [3]
  depth_scale: 1.0

train:
  stage: point_refine
  epochs: 20                    # 修改为 20 个 epoch
  batch_size_per_gpu: 12        # 从 6 提高到 12
  batch_size_point_per_gpu: 12  # 从 6 提高到 12
  batch_size_joint_per_gpu: 12  # 从 6 提高到 12
  num_workers: 8                # 从 12 降低到 8
  grad_accum_steps: 2           # 新增：梯度累积，等效 batch size=24
  grad_clip: 1.0
  amp_dtype: bf16
  seed: 42
  log_interval: 20
  val_interval: 1
  save_interval: 2
  monitor_key: point_abs_error
  use_loss_nan_check: true
  early_stop_on_nan: true
  tensorboard:
    enable: true
    log_dir: tensorboard
    scalar_interval: 20
    image_interval: 500
    feature_stage: stage2

optim:
  name: adamw
  lr_backbone: 0.0              # backbone 冻结
  lr_coarse: 0.0                # coarse 冻结
  lr_point: 0.0002              # 降低学习率适应更大 batch size
  joint_coarse_lr_scale: 0.2
  weight_decay: 0.01
  betas: [0.9, 0.999]
  warmup_epochs: 1              # 新增 warmup
  warmup_lr_init: 1.0e-6

scheduler:
  name: cosine
  min_lr: 1.0e-6

loss:
  coarse_weight: 0.0
  chamfer_weight: 1.0
  uncertainty_weight: 0.2
  feature_weight: 0.5
  repulsion_weight: 0.05
  alpha_weight: 0.2
  alpha_error_threshold: 2.0
  feature_stage: stage2
  depth_loss_scale: 0.01
  chamfer_loss_scale: 0.001

ddp:
  backend: nccl
  find_unused_parameters: false
  broadcast_buffers: false
